name: Deploy accesso to GitHub Pages

on:
  push:
    branches: [tool/accesso]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: accesso
      - uses: actions/checkout@v4
        with:
          ref: tool/loopy
          path: loopy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            accesso/package-lock.json
            loopy/package-lock.json
      - name: Build accesso
        working-directory: accesso
        run: |
          npm ci
          npm run build:web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Build loopy
        working-directory: loopy
        run: |
          npm ci
          npm run build:web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Assemble site
        run: |
          mkdir -p site
          cp -R accesso/dist-web/accesso site/accesso
          cp -R loopy/dist-web/loopy site/loopy
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
