<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Loopy extension icon.

    Filled violet circle (Tailwind Violet 500, matching the `fab-bg` token
    in src/tokens/_tokens.scss) with the lucide `Repeat` glyph in white on
    top. The glyph is rendered inside a nested 24-unit coordinate space via
    transform="translate scale" so the original lucide path data stays
    verbatim and easy to swap for another icon later.

    IMPORTANT: Keep this comment free of consecutive hyphens. XML forbids
    "\u002d\u002d" inside comments, and macOS `qlmanage` will silently
    rasterize the resulting XML parse error page into your PNG instead of
    the icon. If you must reference a CSS custom property here, spell it
    like `fab-bg` or `(dash dash)fab-bg`.

    To regenerate PNG assets after editing this file, run:
      npm run icons
    That writes extension sizes to icons/ (transparent) and PWA sizes
    to public/icons/ (opaque violet so iOS home-screen icons stay clean).
  -->
  <circle cx="64" cy="64" r="60" fill="#8b5cf6" />
  <g
    transform="translate(25.6 25.6) scale(3.2)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="m17 2 4 4-4 4" />
    <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
    <path d="m7 22-4-4 4-4" />
    <path d="M21 13v1a4 4 0 0 1-4 4H3" />
  </g>
</svg>
