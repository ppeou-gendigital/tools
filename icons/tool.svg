<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Viaggio extension / PWA icon.

    Filled fuchsia rounded square (Tailwind Fuchsia 500, matching the fab-bg
    token in src/tokens/_tokens.scss) with the lucide PlaneTakeoff glyph in
    white on top. The glyph is rendered inside a nested 24-unit coordinate
    space via transform="translate scale" so the original lucide path data
    stays verbatim and easy to swap for another icon later.

    IMPORTANT: Keep this comment free of consecutive hyphens. XML forbids
    them inside comments, and macOS qlmanage will silently rasterize the
    resulting XML parse error page into your PNG instead of the icon. If
    you must reference a CSS custom property here, spell it like fab-bg
    or (dash dash)fab-bg.

    To regenerate PNG assets after editing this file, run:
      npm run icons
    That writes extension sizes to icons/ (transparent) and PWA sizes
    to public/icons/ (opaque fuchsia so iOS home-screen icons stay clean).
  -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="#d946ef" />
  <g
    transform="translate(25.6 25.6) scale(3.2)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M2 22h20" />
    <path d="M6.36 17.4 4 17l-2-4 1.1-.55a2 2 0 0 1 1.8 0l.17.1a2 2 0 0 0 1.8 0L8 12 5 6l.9-.45a2 2 0 0 1 2.09.2l4.02 3a2 2 0 0 0 2.1.2l4.19-2.06a2.41 2.41 0 0 1 1.73-.17L21 7a1.4 1.4 0 0 1 .87 1.99l-.38.76c-.23.46-.6.84-1.07 1.08L7.58 17.2a2 2 0 0 1-1.22.18Z" />
  </g>
</svg>
