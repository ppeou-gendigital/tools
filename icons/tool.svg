<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Jira Capacity brand mark.

    Ocean rounded square (#0F766E, matching fab-bg token) with the lucide
    Summary glyph in white. The glyph uses a nested 24-unit coordinate space
    via transform so the original lucide path data stays verbatim.

    Regenerate PNGs after edits:
      npm run icons
  -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="#0F766E" />
  <g
    transform="translate(25.6 25.6) scale(3.2)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M15 4H7" />
    <path d="m18 16 3 3-3 3" />
    <path d="M3 4v13a2 2 0 0 0 2 2h16" />
    <path d="M7 14h7" />
    <path d="M7 9h12" />
  </g>
</svg>
