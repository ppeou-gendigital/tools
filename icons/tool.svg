<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!--
    Docto extension / PWA icon.

    Filled sky rounded square (Tailwind Sky 500, matching the fab-bg token
    in src/tokens/_tokens.scss) with the lucide HeartPlus glyph in white
    on top. The glyph is rendered inside a nested 24-unit coordinate space
    via transform="translate scale" so the original lucide path data stays
    verbatim and easy to swap for another icon later.

    IMPORTANT: Keep this comment free of consecutive hyphens. XML forbids
    them inside comments, and macOS qlmanage will silently rasterize the
    resulting XML parse error page into your PNG instead of the icon. If
    you must reference a CSS custom property here, spell it like fab-bg
    or (dash dash)fab-bg.

    To regenerate PNG assets after editing this file, run:
      npm run icons
    That writes extension sizes to icons/ (transparent) and PWA sizes
    to public/icons/ (opaque sky so iOS home-screen icons stay clean).
  -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="#0ea5e9" />
  <g
    transform="translate(25.6 25.6) scale(3.2)"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="m14.479 19.374-.971.939a2 2 0 0 1-3 .019L5 15c-1.5-1.5-3-3.2-3-5.5a5.5 5.5 0 0 1 9.591-3.676.56.56 0 0 0 .818 0A5.49 5.49 0 0 1 22 9.5a5.2 5.2 0 0 1-.219 1.49" />
    <path d="M15 15h6" />
    <path d="M18 12v6" />
  </g>
</svg>
